<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Test Page</title>
<meta name="robots" content="noindex">
<style>
  body { margin: 0; font: 1.1rem/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f7fa; color: #1b1f24; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  code { background: #e8ecf1; padding: 2px 6px; border-radius: 6px; font-size: .95rem; }
</style>
</head>
<body>
<main>
  <h1>Silicon Valley Comfort chat test page</h1>
  <p>The chat bubble is in the bottom right corner. Send a message and watch it land in Telegram.</p>
  <p>To put it on air.systems, add this one line to the site footer:</p>
  <p><code id="snippet"></code></p>
</main>
<script>
  document.getElementById('snippet').textContent = '<script src="' + location.origin + '/widget.js" defer><\/script>'
</script>
<script src="/widget.js" defer></script>
</body>
</html>
